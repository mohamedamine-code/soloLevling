appId: com.sololeving.app
productName: soloLeving
directories:
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  # Icon: build/icon.ico is added in the production phase (Phase 7).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
