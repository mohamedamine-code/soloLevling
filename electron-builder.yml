appId: com.sololeving.app
productName: soloLeving
directories:
  buildResources: build
files:
  - out/**
  - package.json
# Runtime icon for the tray and window title bars (dev reads build/icon.ico).
extraResources:
  - from: build/icon.ico
    to: icon.ico
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  # Icon: build/icon.ico is added in the production phase (Phase 7).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
